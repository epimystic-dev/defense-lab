[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshdcheck"
version = "0.1.0"
description = "Static hardening linter for sshd_config files - flags fifteen posture defects against CIS, Mozilla OpenSSH, and NIST SP 800-53 controls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ssh", "sshd", "openssh", "linter", "hardening", "cis", "nist"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.scripts]
sshdcheck = "sshdcheck.cli:main"

[tool.setuptools.packages.find]
include = ["sshdcheck*"]
exclude = ["tests*", "examples*"]
