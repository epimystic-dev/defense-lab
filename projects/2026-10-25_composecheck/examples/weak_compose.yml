# weak_compose.yml - synthetic docker-compose file shaped to demonstrate
# what composecheck catches. Every weakness here is a shape, not an
# attack; the secret-shaped values below are the literal strings
# "changeme" and "notasecret", not real credentials.

version: "3.8"

services:
  dangerous:
    image: ubuntu:latest
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      - DATABASE_PASSWORD=changeme
      - API_TOKEN=notasecret
      - LOG_LEVEL=info
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
